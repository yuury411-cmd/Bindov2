9f7f0;color:#16774f}.list{display:grid;gap:10px}.rowitem{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}.rowitem .grow{flex:1;min-width:0}.rowitem b{font-size:13px}.rowitem small{display:block;color:var(--muted);font-size:11px}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);outline:none}.search:focus,textarea:focus,select:focus{border-color:var(--primary)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0;position:sticky;top:68px;z-index:3;background:var(--bg);padding:8px 0}.tab{min-height:42px}.lesson table{display:block;overflow-x:auto;white-space:normal}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:9px;font-size:12px}.tab.active{background:var(--soft);border-color:transparent;color:var(--primary);font-weight:800}.lesson h2{font-size:19px;margin:24px 0 8px}.lesson h3{font-size:15px;margin:18px 0 7px}.lesson p,.lesson li{font-size:14px}.lesson .callout{background:var(--soft);border-left:3px solid var(--primary);padding:12px 15px;border-radius:8px;margin:12px 0}.lesson table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}.lesson th,.lesson td{border:1px solid var(--line);padding:9px;text-align:left}.lesson th{background:var(--soft)}.lesson details{border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0}.lesson .lesson-block{margin:14px 0;padding:13px;border:1px solid var(--line);border-radius:11px}.lesson .lesson-block h3{margin:0 0 7px}.lesson .lesson-actions{display:flex;gap:8px;flex-wrap:wrap}.option:has(input:checked){border-color:var(--primary);background:var(--soft)}.question-meta{display:flex;gap:7px;flex-wrap:wrap}.search-empty{padding:18px;text-align:center;color:var(--muted)}.lesson summary{font-weight:700;cursor:pointer}.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}.question{font-size:17px;font-weight:700;margin:15px 0}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px;margin:9px 0;cursor:pointer}.option:hover{border-color:var(--primary)}.option.selected{border-color:var(--primary);background:var(--soft)}.option input{accent-color:var(--primary);margin-top:5px}.qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qnav button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px;border-radius:8px}.qnav button.done{background:var(--soft);color:var(--primary);border-color:var(--primary)}.qnav button.current{outline:2px solid var(--primary)}.result-score{font-size:48px;font-weight:900;color:var(--primary)}.answer-good{color:var(--green);font-weight:700}.answer-bad{color:var(--red);font-weight:700}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:var(--muted)}select,textarea,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);color:var(--text);width:100%}textarea{min-height:100px;resize:vertical}.flash{min-height:200px;display:grid;place-items:center;text-align:center;background:var(--soft);border-radius:15px;padding:24px;cursor:pointer}.flash strong{font-size:22px}.empty{text-align:center;padding:35px;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#172033;color:white;padding:11px 16px;border-radius:10px;z-index:20;font-size:13px;box-shadow:var(--shadow)}.mobile-nav{display:none}.footer-note{color:var(--muted);font-size:11px;margin-top:20px}.badge-row{display:flex;gap:6px;flex-wrap:wrap}.review{padding:12px;border:1px solid var(--line);border-radius:10px;margin:9px 0}.review p{margin:6px 0;font-size:13px}

<script>
const chapters=[
{id:1,title:"Teks Laporan Hasil Observasi",short:"Teks LHO",icon:"🔎",desc:"Memahami teks faktual berdasarkan pengamatan yang sistematis dan objektif.",sections:[
["Pengertian Teks LHO",`Teks Laporan Hasil Observasi (LHO) adalah teks yang berisi informasi mengenai suatu objek berdasarkan hasil pengamatan yang dilakukan secara sistematis dan objektif. Observasi berarti kegiatan mengamati objek; objektif berarti berdasarkan fakta, bukan pendapat pribadi; sistematis berarti tersusun teratur; dan faktual berarti berdasarkan kenyataan yang dapat dibuktikan.`,`Contoh: mengamati kucing berdasarkan bentuk tubuh, jumlah kaki, makanan, dan kebiasaannya.`],
["Ciri-Ciri Teks LHO",`Teks LHO bersifat objektif, faktual, informatif, sistematis, membahas objek secara umum, menggunakan bahasa baku, serta tidak bertujuan utama menghibur atau membujuk.`,`Laporan tentang kelompok kucing menjelaskan karakteristik umum yang dapat diamati, bukan hanya kesan pribadi penulis.`],
["Struktur Teks LHO",`Strukturnya terdiri atas pernyataan umum, deskripsi bagian, dan deskripsi manfaat atau simpulan. Pernyataan umum mengenalkan dan mengklasifikasikan objek. Deskripsi bagian menjelaskan ciri terperinci. Deskripsi manfaat atau simpulan menjelaskan kegunaan objek atau hasil akhir pengamatan.`,`Pernyataan umum: Kucing merupakan mamalia keluarga Felidae. Deskripsi bagian: kucing memiliki empat kaki dan ekor. Manfaat: kucing dapat membantu mengendalikan populasi tikus.`],
["Jenis-Jenis Observasi",`Berdasarkan objek, observasi dapat mengamati hewan, tumbuhan, lingkungan, benda, atau fenomena. Berdasarkan cakupan, observasi umum membahas objek secara menyeluruh, sedangkan observasi khusus memusatkan perhatian pada aspek tertentu.`,`Mengamati seluruh kondisi perpustakaan termasuk observasi umum; mengamati pencahayaan perpustakaan termasuk observasi khusus.`],
["Kaidah Kebahasaan",`Unsur pentingnya meliputi nomina (kata benda), verba (kata kerja), kalimat definisi, kalimat deskripsi, istilah ilmiah, kata klasifikasi, konjungsi, dan kalimat faktual. Kalimat definisi menjawab apa itu objek, sedangkan kalimat deskripsi menjelaskan bagaimana cirinya.`,`Definisi: Kucing merupakan mamalia. Deskripsi: Kucing memiliki empat kaki. Istilah ilmiah: fotosintesis, habitat, ekosistem, mamalia.`],
["Tujuan dan Fungsi",`Tujuannya memberikan informasi, menjelaskan karakteristik, mengelompokkan objek, mendokumentasikan pengamatan, dan menambah pengetahuan. Fungsinya sebagai sumber informasi, dokumentasi, bahan penelitian sederhana, sarana pembelajaran, dan dasar keputusan berdasarkan fakta.`,`Laporan pengamatan kebersihan kelas dapat menjadi dasar menentukan bagian yang perlu dibersihkan.`],
["Langkah Menyusun LHO",`Tahapannya: menentukan objek, menentukan tujuan, melakukan pengamatan, mengumpulkan data, mengelompokkan informasi, menyusun kerangka, mengembangkan teks, dan menyunting fakta serta bahasa.`,`Saat mengamati taman sekolah, catat jenis tanaman, kondisi tanah, jumlah tempat sampah, dan keadaan kebersihan.`],
["Perbedaan dengan Teks Lain",`LHO memberikan informasi berdasarkan fakta observasi. Teks deskripsi menggambarkan detail objek. Eksplanasi menjelaskan proses dan sebab-akibat fenomena. Anekdot menghibur sekaligus menyampaikan kritik atau sindiran.`,`LHO: Kucing merupakan mamalia. Deskripsi: kucing saya berbulu putih. Eksplanasi: proses terjadinya hujan.`],
["Kesalahan Umum",`Kesalahan yang perlu dihindari ialah mencampurkan fakta dengan opini, mengabaikan struktur, memakai bahasa sehari-hari secara berlebihan, kurang mengamati, mengulang informasi, dan menganggap semua tulisan tentang benda sebagai LHO.`,`Ganti “taman itu sangat indah” (penilaian subjektif) dengan fakta teramati, misalnya “taman memiliki 12 tanaman bunga”.`],
["Penerapan dalam Kehidupan",`LHO dapat diterapkan di sekolah, masyarakat, perhotelan, pariwisata, pertanian, dan lingkungan hidup. Dalam perhotelan, objek pengamatan dapat berupa kebersihan kamar, fasilitas, dan kelengkapan perlengkapan hotel.`,`Pengamatan kondisi kamar hotel dapat mencatat kebersihan lantai, kelengkapan handuk, dan fungsi fasilitas.`],
["Istilah Penting",`Observasi: kegiatan mengamati. Objektif: berdasarkan fakta. Subjektif: berdasarkan pendapat pribadi. Sistematis: teratur. Faktual: berdasarkan kenyataan. Klasifikasi: pengelompokan. Deskripsi: penggambaran. Identifikasi: mengenali objek. Verba: kata kerja. Nomina: kata benda. Konjungsi: kata penghubung.`,`Istilah lain: definisi, fenomena, data, simpulan, dan ekosistem.`],
["Inti Materi",`Lima inti LHO ialah pengertian sebagai teks hasil pengamatan; sifat objektif, faktual, informatif, sistematis; struktur pernyataan umum–deskripsi bagian–manfaat/simpulan; kaidah kebahasaan; dan langkah menyusun dari menentukan objek hingga menyunting.`,`Ingat: laporan harus dapat dipertanggungjawabkan berdasarkan fakta yang diamati.`],
["Pernyataan Umum dan Klasifikasi",`Pernyataan umum berada pada bagian awal laporan. Bagian ini memperkenalkan objek yang diamati, memberikan definisi atau identitas umum, dan dapat mengelompokkan objek ke dalam kelas yang lebih luas. Informasi pada bagian ini sebaiknya mencakup objek secara umum, bukan rincian satu bagian saja.`,`Contoh: “Mangrove merupakan kelompok tumbuhan yang hidup di wilayah pesisir dan mampu beradaptasi dengan lingkungan berkadar garam.” Kalimat ini mengenalkan dan mengklasifikasikan objek.`],
["Deskripsi Bagian dan Manfaat",`Deskripsi bagian menguraikan ciri, bagian, sifat, perilaku, habitat, atau komponen objek berdasarkan data pengamatan. Deskripsi manfaat menjelaskan kegunaan atau peran objek jika memang relevan dan didukung informasi. Tidak semua laporan harus memaksakan manfaat apabila objek yang diamati tidak memiliki manfaat khusus yang dapat dibuktikan.`,`Pada laporan mangrove, deskripsi bagian dapat menjelaskan akar tunjang, daun, dan habitat. Deskripsi manfaat dapat menjelaskan perannya membantu mengurangi abrasi dan menjadi habitat biota.`],
["Nomina, Verba, dan Istilah Ilmiah",`Nomina adalah kata yang menamai orang, tempat, benda, atau konsep, misalnya “akar”, “ekosistem”, dan “air”. Verba menyatakan tindakan, proses, atau keadaan, misalnya “tumbuh”, “menyerap”, dan “menghasilkan”. Istilah ilmiah digunakan secara tepat sesuai bidang objek yang diamati.`,`Dalam kalimat “Akar mangrove menopang tumbuhan pada tanah berlumpur”, “akar” dan “tumbuhan” merupakan nomina, sedangkan “menopang” merupakan verba.`],
["Cara Mengumpulkan dan Memeriksa Data",`Data observasi dapat diperoleh melalui pengamatan langsung, pencatatan, pengukuran sederhana, dokumentasi, dan wawancara sebagai data pendukung. Catat waktu, tempat, kondisi, serta satuan pengukuran. Bedakan hasil pengamatan langsung dari informasi yang diperoleh melalui sumber lain, lalu periksa konsistensi sebelum menulis laporan.`,`Catatan “suhu 28 °C pada pukul 09.00” lebih dapat diperiksa daripada “udara terasa sangat panas” tanpa keterangan pendukung.`],
["Contoh Teks dan Analisis LHO",`Contoh singkat: “Perpustakaan sekolah merupakan fasilitas belajar yang menyediakan bahan bacaan dan ruang membaca. Ruangan ini memiliki rak buku, meja, kursi, dan meja layanan. Pada saat pengamatan, terdapat delapan rak buku dan dua meja baca panjang. Perpustakaan digunakan siswa untuk membaca dan mencari referensi.” Pernyataan umum mengenalkan perpustakaan; deskripsi bagian menyebut fasilitas dan data; kalimat akhir menjelaskan fungsi.`,`Analisis harus menunjuk bukti kalimat dalam teks. Jangan menyebut sebuah kalimat sebagai deskripsi manfaat jika kalimat tersebut hanya menyebut bentuk atau jumlah bagian objek.`]
]},
{id:2,title:"Teks Anekdot",short:"Anekdot",icon:"💬",desc:"Mengenali cerita singkat yang menggunakan humor untuk menyampaikan kritik atau pesan.",sections:[
["Pengertian Teks Anekdot",`Teks anekdot adalah cerita singkat yang menarik dan lucu serta biasanya mengandung kritik, sindiran, atau pesan terhadap keadaan, perilaku, maupun fenomena sosial. Tidak semua cerita lucu adalah anekdot: humor biasa terutama menghibur, sedangkan anekdot menghibur sekaligus biasanya menyampaikan kritik atau pesan.`,`Cerita petugas yang menyebut pelayanan cepat padahal warga menunggu berhari-hari menyindir pelayanan yang lambat.`],
["Ciri-Ciri Teks Anekdot",`Ciri utamanya: mengandung humor; kritik atau sindiran; menghibur sekaligus memberi pesan; singkat dan menarik; memiliki tokoh; menghadirkan kejadian unik; serta mengandung makna tersirat.`,`Jawaban tokoh yang tidak terduga dapat menjadi humor sekaligus memperlihatkan masalah yang dikritik.`],
["Struktur Teks Anekdot",`Strukturnya ialah abstraksi (gambaran awal), orientasi (pengenalan tokoh dan situasi), krisis (masalah atau kejadian unik), reaksi (tanggapan terhadap krisis), dan koda (penutup atau pesan). Abstraksi bersifat opsional dan tidak selalu muncul terpisah.`,`Krisis adalah masalahnya; reaksi adalah tanggapan terhadap masalah tersebut.`],
["Kaidah Kebahasaan",`Kaidahnya mencakup kalimat langsung dan tidak langsung, verba material (tindakan fisik), verba mental (pikiran/perasaan), konjungsi temporal, keterangan waktu lampau, pertanyaan retoris, kalimat seru, konjungsi sebab-akibat, dan majas sindiran.`,`“Guru bertanya, ‘Mengapa kamu terlambat?’” merupakan kalimat langsung. “Guru bertanya mengapa ia terlambat” merupakan kalimat tidak langsung.`],
["Jenis Berdasarkan Tema",`Anekdot dapat bertema pendidikan, sosial, politik, pelayanan publik, hukum, dan lingkungan. Pengelompokan ini berdasarkan masalah yang disindir atau dibahas.`,`Anekdot tentang antrean administrasi yang sangat lama dapat termasuk tema pelayanan publik.`],
["Majas Sindiran",`Ironi adalah sindiran halus yang menyatakan hal berlawanan dengan kenyataan. Sinisme lebih langsung dan menunjukkan keraguan atau ketidakpercayaan. Sarkasme sangat tajam dan dapat terdengar kasar.`,`Ironi: “Rajin sekali, datang saat pelajaran hampir selesai.” Sinisme: “Sepertinya kamu tidak berniat menyelesaikan tugas.”`],
["Tujuan dan Fungsi",`Tujuannya menghibur, menyampaikan kritik sosial, menyadarkan pembaca, memberi pesan moral, dan mengajak berpikir kritis. Fungsinya meliputi hiburan, kritik sosial, pendidikan, refleksi, dan komunikasi. Humor membuat kritik lebih menarik dan dapat disampaikan tanpa bahasa kasar.`,`Cerita lucu tentang kebiasaan menunda pekerjaan dapat mendorong pembaca mengevaluasi perilakunya.`],
["Langkah Membuat Anekdot",`Tentukan tema, kritik atau pesan, tokoh dan latar, kejadian lucu, struktur cerita, kaidah kebahasaan, lalu sunting alur, humor, kritik, dan bahasa.`,`Pastikan humor berhubungan dengan masalah yang dikritik, bukan sekadar lelucon yang ditempelkan.`],
["Perbedaan dengan Teks Lain",`Anekdot bertujuan menghibur dan menyindir. Humor terutama menghibur. Narasi menceritakan rangkaian peristiwa. LHO menyajikan fakta pengamatan. Eksposisi menjelaskan gagasan disertai alasan atau argumentasi.`,`Pembeda utama anekdot ialah perpaduan cerita lucu dengan kritik atau pesan.`],
["Kesalahan Umum",`Kesalahan umum: menganggap semua cerita lucu sebagai anekdot, tidak memiliki kritik jelas, struktur tidak teratur, humor tidak terkait kritik, sindiran terlalu kasar, tidak memahami makna tersirat, dan tertukar antara krisis dengan reaksi.`,`Krisis = masalah muncul. Reaksi = tanggapan terhadap masalah.`],
["Penerapan dalam Kehidupan",`Anekdot dapat digunakan untuk merefleksikan disiplin di sekolah, kepedulian sosial, kebiasaan kerja, serta pelayanan dan koordinasi di perhotelan/pariwisata. Kritik sebaiknya membantu perbaikan tanpa mempermalukan orang.`,`Cerita tentang miskomunikasi pelayanan hotel dapat menyampaikan pentingnya koordinasi antarkaryawan.`],
["Istilah Penting dan Inti Materi",`Anekdot: cerita singkat yang biasanya mengandung humor dan kritik. Abstraksi: gambaran awal. Orientasi: pengenalan. Krisis: masalah. Reaksi: tanggapan. Koda: penutup. Ironi, sinisme, sarkasme: jenis sindiran. Retoris: pertanyaan yang tidak selalu membutuhkan jawaban. Tersirat: tidak langsung; tersurat: langsung.`,`Ingat lima struktur: abstraksi–orientasi–krisis–reaksi–koda.`],
["Abstraksi, Orientasi, dan Krisis",`Abstraksi memberi gambaran singkat tentang hal yang akan diceritakan dan dapat tidak dicantumkan. Orientasi memperkenalkan tokoh, waktu, tempat, atau situasi awal. Krisis menghadirkan masalah, kejanggalan, atau kejadian yang menjadi pusat cerita dan biasanya memicu humor atau kritik.`,`Contoh ringkas: “Pagi itu, Rani datang ke kantor pelayanan.” (orientasi). “Nomor antreannya dipanggil, tetapi loket ternyata belum dibuka.” (krisis).`],
["Reaksi dan Koda",`Reaksi menunjukkan tanggapan tokoh terhadap krisis, misalnya jawaban tak terduga, tindakan, atau penyelesaian. Koda merupakan penutup yang dapat berisi perubahan keadaan, komentar, atau penegasan pesan. Koda tidak selalu hadir secara eksplisit.`,`Jika tokoh menanggapi loket yang belum buka dengan jawaban menyindir, tanggapan tersebut merupakan reaksi; kalimat penutup yang menegaskan perlunya pelayanan tepat waktu dapat menjadi koda.`],
["Kalimat Langsung, Tidak Langsung, dan Retoris",`Kalimat langsung mengutip ucapan tokoh secara langsung dan biasanya memakai tanda petik. Kalimat tidak langsung melaporkan isi ucapan tanpa mengutip persis. Pertanyaan retoris diajukan untuk menegaskan maksud atau menyindir, bukan terutama untuk memperoleh jawaban.`,`Langsung: Petugas berkata, “Silakan menunggu.” Tidak langsung: Petugas meminta warga menunggu. Retoris: “Sampai kapan warga harus menunggu?”`],
["Verba Aksi dan Konjungsi Temporal",`Verba aksi atau verba material menyatakan tindakan yang dapat diamati, misalnya berjalan, menyerahkan, membuka, dan menulis. Konjungsi temporal menghubungkan peristiwa berdasarkan urutan waktu, misalnya kemudian, setelah itu, sebelum, dan akhirnya. Keduanya membantu pembaca mengikuti kejadian dalam cerita.`,`“Setelah itu, warga menyerahkan formulir.” Kata “menyerahkan” menunjukkan tindakan, sedangkan “setelah itu” menunjukkan urutan waktu.`],
["Menyusun Kritik yang Tepat",`Kritik dalam anekdot sebaiknya memiliki sasaran yang jelas, didukung situasi cerita, dan disampaikan secara proporsional. Humor perlu berkaitan dengan masalah yang disorot. Hindari menyerang identitas pribadi atau merendahkan kelompok; arahkan kritik pada tindakan, kebijakan, kebiasaan, atau keadaan yang dapat diperbaiki.`,`Anekdot tentang antrean dapat mengkritik sistem pelayanan yang tidak tertata, bukan menghina orang yang sedang mengantre.`],
["Contoh Teks Anekdot dan Analisis",`Contoh orisinal: “Pagi itu, seorang warga datang ke kantor layanan. Ia bertanya, ‘Apakah loket sudah buka?’ Petugas menjawab, ‘Tentu, kami selalu siap melayani tepat waktu.’ Warga menunjuk jam yang menunjukkan pukul sembilan, sementara loket masih tertutup. ‘Kalau begitu, mungkin jam kantor dan jam dinding kami berbeda,’ katanya. Petugas lalu membuka loket.” Cerita ini menggunakan jawaban tak terduga untuk menyindir ketidaktepatan waktu pelayanan.`,`Orientasi: warga datang ke kantor layanan. Krisis: loket masih tertutup pada pukul sembilan. Reaksi: warga memberi tanggapan ironis. Koda: petugas membuka loket; pesan tersiratnya adalah pelayanan perlu tepat waktu. Abstraksi tidak ditulis terpisah.`]
]},
{id:3,title:"Teks Hikayat",short:"Hikayat",icon:"🏰",desc:"Mempelajari prosa Melayu klasik, ciri, unsur pembangun, struktur, dan nilai kehidupan.",sections:[
["Pengertian Hikayat",`Hikayat adalah karya sastra Melayu klasik berbentuk prosa yang menceritakan kehidupan tokoh, kerajaan, kepahlawanan, atau petualangan. Ceritanya sering mengandung keajaiban, kesaktian, dan peristiwa yang tidak mungkin terjadi dalam kehidupan nyata. Hikayat mengenalkan budaya masa lampau dan mewariskan nilai kehidupan.`,`Contoh gambaran: pangeran dengan pedang ajaib menyelamatkan kerajaan dari naga.`],
["Istilah Penting",`Sastra lama: karya sastra masa lampau. Prosa: karya berbentuk cerita, bukan bait puisi. Melayu klasik: tradisi bahasa/sastra Melayu lama. Istana sentris: berpusat pada kerajaan. Kemustahilan: kejadian tak mungkin secara nyata. Kesaktian: kemampuan luar biasa. Anonim: pengarang tidak diketahui. Pralogis: mengikuti logika dunia imajinatif.`,`Tidak semua cerita rakyat atau cerita ajaib otomatis disebut hikayat.`],
["Sejarah Perkembangan",`Hikayat berkembang dalam tradisi Melayu dan diwariskan melalui tradisi lisan, kemudian tradisi tulisan dalam naskah berbahasa Melayu lama. Perkembangannya juga dipengaruhi budaya dan agama Hindu-Buddha, Islam, serta tradisi lokal.`,`Pewarisan lisan dapat menyebabkan variasi cerita dari satu penceritaan ke penceritaan lain.`],
["Unsur Intrinsik",`Unsur intrinsik membangun cerita dari dalam: tema (gagasan utama), tokoh (pelaku), penokohan (sifat tokoh), alur (rangkaian peristiwa), latar (tempat/waktu/suasana), sudut pandang (posisi pencerita), dan amanat (pesan).`,`Tokoh menjawab “siapa?”, penokohan menjawab “bagaimana sifatnya?”, tema adalah pokok cerita, amanat adalah pesannya.`],
["Unsur Ekstrinsik",`Unsur ekstrinsik berasal dari luar cerita dan memengaruhi karya, misalnya nilai agama, sosial, budaya, moral, serta latar sejarah dan keadaan masyarakat pada masa cerita berkembang.`,`Intrinsik berasal dari dalam cerita; ekstrinsik berasal dari luar cerita.`],
["Nilai-Nilai dalam Hikayat",`Hikayat dapat mengandung nilai moral, agama, sosial, budaya, pendidikan, dan kepemimpinan. Tidak semua hikayat memuat seluruh nilai; nilai yang ditemukan bergantung pada isi cerita.`,`Tindakan menolong orang lain dapat menunjukkan nilai sosial; berkata jujur menunjukkan nilai moral.`],
["Ciri-Ciri Hikayat",`Ciri yang sering ditemukan: istana sentris, kemustahilan, kesaktian, anonim, bahasa Melayu klasik, serta nilai kehidupan. Contoh kosakata klasik: alkisah, hatta, dan syahdan.`,`Kemampuan tokoh terbang tanpa alat merupakan contoh kemustahilan dalam dunia cerita.`],
["Bahasa Melayu Klasik",`Kosakata yang sering dijumpai: alkisah (konon/diceritakan), syahdan (selanjutnya), hatta (lalu), baginda (raja), titah (perintah raja), patik (sebutan diri merendah kepada raja), tuanku (sapaan hormat), beroleh (mendapatkan), hulubalang (panglima/prajurit), permaisuri (istri raja), balairung (ruang pertemuan), mahligai (istana/tempat tinggal megah).`,`“Syahdan, baginda memanggil hulubalang” berarti kemudian raja memanggil panglima.`],
["Struktur Hikayat",`Struktur yang dapat digunakan untuk menganalisis ialah abstraksi (gambaran awal), orientasi (pengenalan), komplikasi (muncul konflik), evaluasi (perkembangan/penilaian konflik), resolusi (penyelesaian), dan koda (penutup/pesan). Tidak semua hikayat menampilkan setiap bagian secara jelas atau berurutan sama.`,`Konflik kerajaan diserang naga adalah komplikasi; keberhasilan mengatasi serangan merupakan resolusi.`],
["Jenis-Jenis Hikayat",`Berdasarkan isi, terdapat hikayat kepahlawanan, keagamaan, sejarah, percintaan, dan petualangan. Berdasarkan asal/pengaruh budaya, dapat dibahas Melayu asli, pengaruh Hindu, dan pengaruh Islam. Satu hikayat dapat memiliki lebih dari satu pengaruh.`,`Contoh yang disebut dalam materi: Hikayat Hang Tuah, Hikayat Sri Rama, dan Hikayat Amir Hamzah.`],
["Contoh Hikayat Terkenal",`Hikayat Hang Tuah mengisahkan Hang Tuah yang dikenal karena keberanian, kesetiaan, dan kemampuannya sebagai pendekar. Hikayat Bayan Budiman menampilkan burung bayan yang menyampaikan cerita dan nasihat. Hikayat Raja-Raja Pasai berkisah tentang kerajaan Samudra Pasai dan para penguasanya. Hikayat Amir Hamzah mengisahkan kepahlawanan dan petualangan. Hikayat Sri Rama merupakan adaptasi tradisi Ramayana ke dalam sastra Melayu.`,`Gunakan contoh ini untuk mengenali ragam tema hikayat, bukan menganggap semua detail cerita sebagai catatan sejarah pasti.`],
["Fungsi dan Tujuan",`Hikayat berfungsi sebagai hiburan, pendidikan, penyampaian moral, pelestarian budaya, gambaran sosial, dan penyampaian pandangan hidup masyarakat.`,`Kisah pemimpin yang adil dapat menjadi sarana membahas kepemimpinan.`],
["Cara Menganalisis",`Baca cerita secara utuh; temukan tokoh utama dan tambahan; identifikasi sifat; tentukan latar; temukan konflik; pahami penyelesaian; identifikasi nilai dan amanat; lalu periksa ciri khas hikayat seperti kerajaan, kesaktian, kemustahilan, dan bahasa klasik.`,`Pisahkan bukti dari cerita dengan pendapat pribadi saat menuliskan hasil analisis.`],
["Perbedaan dengan Cerita Lain",`Hikayat adalah prosa Melayu klasik. Cerpen merupakan cerita pendek modern. Legenda sering terkait asal-usul tempat/peristiwa. Mite berkaitan dengan kepercayaan, dewa, atau makhluk gaib. Fabel memakai binatang sebagai tokoh yang berperilaku seperti manusia. Novel adalah prosa panjang. Dongeng adalah cerita khayalan/tradisional yang dapat mengandung keajaiban.`,`Pengelompokan perlu melihat karakteristik, bukan hanya karena cerita memiliki kerajaan atau keajaiban.`],
["Kesalahan Umum",`Jangan menganggap semua cerita kerajaan pasti hikayat; semua cerita ajaib adalah hikayat; tokoh sama dengan penokohan; tema sama dengan amanat; semua hikayat pasti anonim; atau hikayat sebagai catatan sejarah yang seluruhnya pasti benar. Hikayat dapat mencampurkan unsur sejarah dan imajinasi.`,`Periksa ciri sastra klasik dan konteks cerita sebelum mengklasifikasikan.`],
["Penerapan Nilai",`Nilai hikayat dapat diterapkan di sekolah melalui kejujuran, kepemimpinan, tanggung jawab, dan menghargai teman; di masyarakat melalui pelestarian budaya; serta di dunia kerja/perhotelan melalui kejujuran, kesopanan, tanggung jawab, kepemimpinan adil, dan kerja sama.`,`Nilai cerita dapat diambil sebagai teladan, tanpa harus meniru unsur ajaibnya.`],
["Kosakata dan Inti Materi",`Hikayat: prosa Melayu klasik. Anonim: pengarang tidak diketahui. Istana sentris: berpusat pada kerajaan. Kemustahilan: kejadian tak mungkin. Kesaktian: kemampuan luar biasa. Tema: gagasan utama. Tokoh: pelaku. Penokohan: sifat. Alur: rangkaian peristiwa. Latar: tempat/waktu/suasana. Amanat: pesan. Konflik: masalah. Resolusi: penyelesaian.`,`Ingat: pengertian, ciri, unsur intrinsik-ekstrinsik, nilai, struktur, bahasa klasik, dan contoh hikayat.`],
["Tema, Alur, dan Latar",`Tema adalah gagasan pokok yang mendasari cerita. Alur merupakan rangkaian peristiwa yang membentuk cerita; alur dapat bergerak maju, mundur, atau campuran. Latar meliputi tempat, waktu, dan suasana terjadinya peristiwa. Ketiganya saling berkaitan dalam membangun cerita.`,`Jika cerita berpusat pada perjuangan seorang putri menyelamatkan kerajaan, perjuangan tersebut dapat menjadi tema; urutan peristiwanya merupakan alur; istana dan masa kerajaan merupakan bagian latar.`],
["Sudut Pandang, Amanat, dan Gaya Bahasa",`Sudut pandang menunjukkan posisi pencerita, misalnya orang pertama (“aku”) atau orang ketiga (“ia”, nama tokoh). Amanat adalah pesan yang dapat disimpulkan dari tindakan dan akibat dalam cerita. Gaya bahasa adalah cara pengarang menggunakan bahasa untuk membangun suasana, penekanan, atau keindahan.`,`Jangan menyamakan tema dengan amanat: tema merupakan pokok persoalan, sedangkan amanat merupakan pesan yang dapat dipetik pembaca.`],
["Nilai Moral, Agama, Sosial, Budaya, dan Pendidikan",`Nilai moral berkaitan dengan baik-buruk perilaku; nilai agama berkaitan dengan keyakinan dan praktik keagamaan; nilai sosial berkaitan dengan hubungan antarmanusia; nilai budaya berkaitan dengan adat dan kebiasaan; nilai pendidikan berkaitan dengan pembelajaran atau pembentukan sikap. Identifikasi nilai harus disertai bukti peristiwa atau tindakan tokoh.`,`Tindakan tokoh menepati janji dapat menunjukkan nilai moral; membantu warga dapat menunjukkan nilai sosial; menghormati tradisi dapat menunjukkan nilai budaya.`],
["Contoh Analisis Hikayat",`Dalam menganalisis kutipan hikayat, tentukan peristiwa utama, tokoh yang terlibat, sifat tokoh berdasarkan tindakannya, latar yang disebutkan, konflik, penyelesaian, dan pesan. Periksa pula penggunaan kosakata Melayu klasik serta unsur kemustahilan atau kesaktian. Kesimpulan harus didukung bukti dari kutipan, bukan hanya dugaan pembaca.`,`Jika tokoh menolong rakyat meskipun menghadapi bahaya, bukti tindakan itu dapat digunakan untuk membahas penokohan berani dan nilai sosial. Amanatnya perlu dirumuskan berdasarkan keseluruhan cerita.`],
["Kutipan Latihan Bergaya Hikayat",`Kutipan orisinal untuk latihan: “Alkisah, di sebuah negeri, hiduplah seorang raja yang memerintah dengan adil. Pada suatu hari, kemarau panjang menyebabkan rakyat kesulitan memperoleh air. Seorang pemuda pergi mencari sumber air ke hutan. Setelah berdoa dan menolong seekor burung yang terluka, burung itu menunjukkan mata air tersembunyi. Pemuda kembali ke negeri dan membagikan kabar tersebut kepada rakyat.” Kutipan latihan ini dibuat untuk mempelajari ciri bahasa klasik dan nilai cerita, bukan kutipan dari naskah hikayat sejarah.`,`Tokoh: raja dan pemuda. Latar: negeri dan hutan. Konflik: kemarau dan kesulitan air. Peristiwa ajaib: burung menunjukkan mata air. Nilai sosial tampak pada tindakan membagikan kabar agar rakyat terbantu; nilai moral tampak pada sikap menolong.`]
]}
];

   for(let pi=0;pi<5;pi++){
    const pool=optionSets[pi],correct=pool[0],distractors=pool.slice(1,4);
    const answerIndex=(ti*3+pi*2+ch)%4,options=[];

function migrateLegacyHistory(base){
  (base.history||[]).forEach(h=>{
    if(!Array.isArray(h.details))return;
    let fixed=0,correct=0,wrong=0,blank=0;
    h.details=h.details.map(d=>{
      const legacyIndex=Number.isInteger(d.id)?d.id:null;
      const q=legacyIndex!==null?questions[legacyIndex]:questions.find(x=>x.id===d.id);
      if(!q)return d;
      const answer=d.answer;
      const ok=answer===undefined?false:answer===q[5];
      if(answer===undefined)blank++;else if(ok)correct++;else wrong++;
      fixed++;
      return Object.assign({},d,{id:q.id,chapter:q[0],question:q[3],options:q[4].slice(),correct:q[5],answer,ok,explanation:q[6],sectionId:q.sectionId});
    });
    if(fixed===h.details.length&&fixed){h.correct=correct;h.wrong=wrong;h.blank=blank;h.total=h.details.length;h.score=Math.round(correct/h.total*100);h.migratedFromLegacy=true;}
  });

}

function materials(){let c=chapters.find(x=>x.id===activeChapter);return `${head("MATERI PEMBELAJARAN","Jelajahi materi.","Pilih bab, cari subbab, dan pelajari konsep secara bertahap.")}<div class="tabs">${chapters.map(x=>`<button class="tab ${activeChapter===x.id?"active":""}" data-ch="${x.id}">Bab ${x.id} · ${x.short}</button>`).join("")}</div><div class="card"><div class="chapter"><div class="chapter-icon">${c.icon}</div><div><span class="tag">BAB ${c.id} · ${c.sections.length} SUBBAB</span><h2 style="margin:5px 0">${c.title}</h2><p class="muted">${c.desc}</p></div></div></div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Daftar isi</h3><div class="field"><label>Lompat langsung ke subbab</label><select id="jumpSection">${c.sections.map((x,i)=>`<option value="${i}" ${i===activeSection?"selected":""}>${i+1}. ${esc(x[0])}</option>`).join("")}</select></div><input class="search" id="materialSearch" placeholder="Cari subbab dalam bab ini..."><div class="list" id="materialList" style="margin-top:12px">${materialList(c)}</div></div><div class="card lesson" id="lessonPanel">${sectionContent(c,activeSection)}</div></div>`}
function materialList(c,term=""){return c.sections.map((s,i)=>({s,i})).filter(x=>!term||(x.s[0]+" "+x.s[1]).toLowerCase().includes(term.toLowerCase())).map(({s,i})=>`<button class="rowitem" style="width:100%;text-align:left;background:transparent;color:var(--text)" data-sec="${i}"><span class="tag">${String(i+1).padStart(2,"0")}</span><span class="grow"><b>${esc(s[0])}</b><small>${state.completed[c.id+"-"+i]?"✓ Sudah dipelajari":"Belum ditandai selesai"}</small></span><span>›</span></button>`).join("")||`<div class="search-empty">Tidak ada subbab yang cocok.</div>`}

function sectionContent(c,i){const s=c.sections[i];if(!s)return `<div class="empty">Materi tidak ditemukan.</div>`;const related=questions.filter(q=>q[0]===c.id&&q.sectionId===s[0]);const done=!!state.completed[c.id+"-"+i];const text=String(s[1]||"");const parts=text.split(/(?<=[.!?])\s+/).filter(Boolean);const core=parts.slice(0,Math.max(1,Math.ceil(parts.length*.55))).join(" ");const detail=parts.slice(Math.max(1,Math.ceil(parts.length*.55))).join(" ");return `<span class="tag">BAB ${c.id} · SUBBAB ${i+1}</span><h2>${esc(s[0])}</h2><div class="lesson-block"><h3>A. Pengertian dan konsep utama</h3><p>${esc(core||text)}</p></div><div class="lesson-block"><h3>B. Penjelasan</h3><p>${esc(detail||text)}</p></div><div class="callout"><b>C. Contoh konkret</b><br>${esc(s[2]||"Gunakan contoh dari lingkungan sekitar untuk menguji pemahaman konsep.")}</div><div class="lesson-block"><h3>D. Analisis dan penerapan</h3><p>${esc(lessonAnalysis(c.id,s[0]))}</p></div><div class="lesson-block"><h3>E. Poin penting</h3><ul><li>Kenali definisi dan istilah utama.</li><li>Hubungkan konsep dengan bukti atau contoh yang tersedia.</li><li>Bedakan konsep ini dari istilah lain yang mirip.</li><li>Gunakan alasan yang sesuai dengan isi materi, bukan sekadar menghafal kata kunci.</li></ul></div><details><summary>Indikator pemahaman</summary><p>${esc(`Setelah mempelajari ${s[0].toLowerCase()}, kamu diharapkan dapat menjelaskan konsep, mengenali ciri, dan menerapkannya pada contoh yang relevan.`)}</p></details><details><summary>Latihan dari subbab ini (${related.length} soal terhubung)</summary>${related.length?related.map(q=>`<div class="review"><b>${esc(q[3])}</b><p class="muted">${esc(q[6])}</p></div>`).join(""):`<p class="muted">Belum ada soal yang dipetakan secara khusus ke subbab ini. Gunakan materi ini sebagai dasar belajar.</p>`}</details><div class="lesson-actions"><button class="btn ghost" data-sec="${Math.max(0,i-1)}" ${i===0?"disabled":""}>← Sebelumnya</button><button class="btn ${done?"secondary":""}" id="markDone">${done?"✓ Sudah selesai":"Tandai selesai"}</button><button class="btn ghost" id="bookmarkSection">${state.bookmarks.includes(c.id+"-"+i)?"★ Subbab tersimpan":"☆ Bookmark subbab"}</button><button class="btn ghost" data-sec="${Math.min(c.sections.length-1,i+1)}" ${i===c.sections.length-1?"disabled":""}>Berikutnya →</button></div><p class="muted" style="font-size:11px">Status: ${done?"Selesai dipelajari":"Belum ditandai selesai"}</p>`}
function lessonAnalysis(chapter,title){const notes={1:"Pastikan setiap pernyataan didukung hasil pengamatan atau sumber yang disebutkan. Pisahkan data yang terlihat/terukur dari penilaian pribadi, lalu tempatkan informasi pada bagian struktur yang tepat.",2:"Tentukan bagian cerita dengan melihat fungsi kalimat: pengenalan situasi, munculnya masalah, tanggapan tokoh, atau penutup. Kritik harus dapat dikenali dan berkaitan dengan humor atau kejadian dalam cerita.",3:"Gunakan bukti dari cerita untuk menentukan unsur dan nilai. Pisahkan unsur pembangun cerita dari pengaruh luar, serta bedakan unsur imajinatif hikayat dari fakta sejarah yang dapat diverifikasi."};return `${notes[chapter]} Fokus analisis pada subbab “${title}” dan jelaskan alasanmu dengan bukti yang relevan.`}

function bank(){const audit=questionAudit();return `${head("QUESTION BANK","Bank soal","Bank soal aktif berisi soal unik yang tersedia saat ini; jumlah tidak dipaksakan demi kuantitas.")}<div class="card"><div class="grid three"><div class="field"><label>Bab</label><select id="bankChapter"><option value="0">Semua bab</option>${chapters.map(c=>`<option value="${c.id}">Bab ${c.id} · ${c.short}</option>`)}</select></div><div class="field"><label>Jenis soal</label><select id="bankCat"><option value="">Semua jenis</option>${[...new Set(questions.map(q=>q[1]))].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Kesulitan</label><select id="bankDiff"><option value="">Semua tingkat</option><option>Mudah</option><option>Sedang</option><option>Sulit</option></select></div></div><input class="search" id="bankSearch" placeholder="Cari pertanyaan atau konsep..."></div><div class="section-title"><h2 id="bankCount">${questions.length} soal tersedia</h2><span class="muted">${audit.uniqueIds} ID unik · 4 opsi per soal</span></div><div id="bankList" class="list">${bankList(questions)}</div><p class="footer-note">Pemeriksaan otomatis: ${audit.exactDuplicates.length} duplikasi teks persis dan ${audit.potentialDuplicates.length} pasangan kandidat kemiripan teks. Kandidat perlu tinjauan isi manual; jumlah maksimum tiap bab adalah 70, bukan target wajib.</p>`}
function bankList(arr){return arr.map(q=>`<div class="card"><div class="badge-row"><span class="tag">Bab ${q[0]}</span><span class="tag">${esc(q[1])}</span><span class="tag">${esc(q[2])}</span><span class="tag">${q.id}</span><span class="pill">${q.validationStatus}</span></div><p style="font-weight:700">${esc(q[3])}</p><details><summary>Lihat kunci dan pembahasan</summary><p class="answer-good">Jawaban: ${"ABCD"[q[5]]}. ${esc(q[4][q[5]])}</p><p class="muted">${esc(q[6])}</p></details><div class="lesson-actions"><button class="btn secondary" data-bookq="${questions.indexOf(q)}">${state.bookmarks.includes("q"+questions.indexOf(q))?"★ Tersimpan":"☆ Bookmark soal"}</button><button class="btn ghost" data-learn-id="${q[0]}|${encodeURIComponent(q.sectionId)}">Pelajari materi terkait</button></div></div>`).join("")||`<div class="empty">Tidak ada soal yang cocok dengan filter.</div>`}

function builder(){return `${head("QUIZ BUILDER","Rancang kuis sendiri.","Pilih cakupan, kesulitan, jenis, dan sumber soal. Jumlah mengikuti stok yang benar-benar tersedia.")}<div class="grid two"><div class="card"><h2 style="margin-top:0">Konfigurasi kuis</h2><div class="field"><label>Pilih bab</label><select id="buildChapter"><option value="0">Gabungan semua bab</option>${chapters.map(c=>`<option value="${c.id}">Bab ${c.id} · ${c.short}</option>`)}</select></div><div class="field"><label>Jumlah soal</label><select id="buildCount"><option value="5">5 soal</option></select><small class="muted" id="availableCount"></small></div><div class="field"><label>Jenis soal</label><select id="buildCat"><option value="">Semua jenis</option>${[...new Set(questions.map(q=>q[1]))].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Tingkat kesulitan</label><select id="buildDiff"><option value="">Semua tingkat</option><option>Mudah</option><option>Sedang</option><option>Sulit</option></select></div><div class="field"><label>Sumber soal</label><select id="buildSource"><option value="all">Semua soal</option><option value="unseen">Belum pernah dikerjakan</option><option value="wrong">Pernah salah</option><option value="bookmarks">Bookmark</option></select></div><div class="field"><label>Mode pengerjaan</label><select id="buildMode"><option value="practice">Latihan — umpan balik langsung</option><option value="exam">Ujian — pembahasan setelah selesai</option></select></div><div class="field"><label>Batas waktu (menit, 0 = tanpa batas)</label><input type="number" id="buildTime" min="0" max="180" value="0"></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="buildShuffle" checked> Acak urutan soal</label><button class="btn" id="startQuiz" style="margin-top:14px">Mulai kuis →</button></div><div class="card"><h3>Ringkasan ketersediaan</h3><div class="stat"><div><div class="num">${questions.length}</div><small>Soal tersedia</small></div><div class="bubble">▦</div></div><div class="list" style="margin-top:15px">${chapters.map(c=>`<div><div style="display:flex;justify-content:space-between"><b>Bab ${c.id}</b><span class="muted">${questions.filter(q=>q[0]===c.id).length}/100 soal</span></div><div class="progress"><span style="width:${questions.filter(q=>q[0]===c.id).length/100*100}%"></span></div></div>`).join("")}</div><div class="callout" style="margin-top:18px">Soal yang sama tidak akan digandakan untuk memenuhi jumlah. Jika stok hasil filter kurang, pilihan jumlah otomatis dibatasi.</div></div></div>`}
function quizCandidates(){if(!$("#buildChapter"))return [];const ch=+$("#buildChapter").value,cat=$("#buildCat").value,diff=$("#buildDiff").value,source=$("#buildSource").value;let arr=questions.filter(q=>(!ch||q[0]===ch)&&(!cat||q[1]===cat)&&(!diff||q[2]===diff));if(source==="unseen"){const seen=new Set(state.questionSeen||[]);arr=arr.filter(q=>!seen.has(q.id))}if(source==="wrong"){const wrongIds=new Set(state.wrong||[]);arr=arr.filter(q=>wrongIds.has(q.id)||wrongIds.has(questions.indexOf(q)))}if(source==="bookmarks")arr=arr.filter(q=>state.bookmarks.includes("q"+questions.indexOf(q)));return arr}
function updateQuizCount(){const arr=quizCandidates(),sel=$("#buildCount");if(!sel)return;const old=+sel.value||5;const vals=[5,10,15,20,25,30,40,50,60,70,80,90,100].filter(n=>n<=arr.length);if(arr.length&& !vals.includes(arr.length))vals.push(arr.length);vals.sort((a,b)=>a-b);sel.innerHTML=vals.map(n=>`<option value="${n}">${n} soal</option>`).join("")||`<option value="0">Tidak ada soal</option>`;sel.value=String(vals.includes(old)?old:vals[vals.length-1]||0);$("#availableCount").textContent=`${arr.length} soal cocok dengan filter.`;$("#startQuiz").disabled=!arr.length}

function quizPage(){if(!quiz)return "";let q=quiz.items[quizIndex],chosen=quiz.answers[quizIndex],practice=quiz.mode==="practice"&&chosen!==undefined;return `${head("QUIZ IN PROGRESS",quiz.title,`Soal ${quizIndex+1} dari ${quiz.items.length} · ${quiz.mode==="exam"?"Mode ujian":"Mode latihan"}`)}<div class="quiz-layout"><div class="card"><div class="question-meta"><span class="tag">Bab ${q[0]} · ${esc(q[1])}</span><span class="tag">${esc(q[2])}</span><span class="tag">${q.id}</span></div><div style="display:flex;justify-content:space-between;gap:8px;margin-top:10px"><span class="muted">${quiz.timeLimit?`Sisa waktu: ${timeLeft()}`:"Tanpa batas waktu"}</span><span class="muted">${quiz.answers.filter(x=>x!==undefined).length}/${quiz.items.length} terjawab</span></div><div class="progress" style="margin:13px 0"><span style="width:${quiz.answers.filter(x=>x!==undefined).length/quiz.items.length*100}%"></span></div><div class="question">${quizIndex+1}. ${esc(q[3])}</div>${q[4].map((o,i)=>`<label class="option ${chosen===i?"selected":""}"><input type="radio" name="answer" value="${i}" ${chosen===i?"checked":""}><span><b>${"ABCD"[i]}.</b> ${esc(o)}</span></label>`).join("")}${practice?`<div class="callout"><b class="${chosen===q[5]?"answer-good":"answer-bad"}">${chosen===q[5]?"Jawaban benar":"Belum tepat"}</b><p>Jawaban benar: <b>${"ABCD"[q[5]]}. ${esc(q[4][q[5]])}</b></p><p>${esc(q[6])}</p><button class="btn ghost" data-learn-id="${q[0]}|${encodeURIComponent(q.sectionId)}">Pelajari materi terkait</button></div>`:""}<div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap"><button class="btn ghost" id="prevQ" ${quizIndex===0?"disabled":""}>← Sebelumnya</button><button class="btn secondary" id="flagQ">${quiz.flagged.includes(quizIndex)?"★ Ditandai":"☆ Tandai untuk ditinjau"}</button>${quizIndex===quiz.items.length-1?`<button class="btn" id="submitQuiz">Kumpulkan</button>`:`<button class="btn" id="nextQ">Selanjutnya →</button>`}</div></div><div class="card quiz-side"><h3 style="margin-top:0">Navigasi soal</h3><div class="qnav">${quiz.items.map((_,i)=>`<button data-qnav="${i}" class="${i===quizIndex?"current":""} ${quiz.answers[i]!==undefined?"done":""}">${i+1}</button>`).join("")}</div><p class="muted" style="font-size:11px;margin-top:13px">Terjawab: ${quiz.answers.filter(x=>x!==undefined).length}/${quiz.items.length}<br>Belum dijawab: ${quiz.answers.filter(x=>x===undefined).length}<br>Ditandai: ${quiz.flagged.length}</p><button class="btn danger" style="width:100%" id="submitQuiz2">Kumpulkan kuis</button></div></div>`}

function timeLeft(){if(!quiz||!quiz.timeLimit)return "—";let sec=Math.max(0,quiz.timeLimit*60-Math.floor((Date.now()-quiz.started)/1000));if(sec===0&&!quiz.finishing){quiz.finishing=true;setTimeout(()=>finishQuiz(true),0);return "00:00"}return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function resultPage(){let h=state.history[0];if(!h)return `${head("HASIL","Belum ada hasil","Selesaikan kuis untuk melihat evaluasi.")}`;return `${head("QUIZ RESULT","Hasil kuis",`${h.title} · ${h.mode==="exam"?"Mode ujian":"Mode latihan"}`)}<div class="card" style="text-align:center"><div class="eyebrow">NILAI AKHIR</div><div class="result-score">${Number(h.score)||0}%</div><p>${h.correct} benar · ${h.wrong} salah · ${h.blank} kosong dari ${h.total} soal</p><p class="muted">Waktu pengerjaan: ${formatDuration(h.durationSeconds||0)} · ${new Date(h.date||h.ended||Date.now()).toLocaleString("id-ID")}</p><div class="grid three"><div><b>${h.correct}</b><div class="muted">Benar</div></div><div><b>${h.wrong}</b><div class="muted">Salah</div></div><div><b>${h.blank}</b><div class="muted">Kosong</div></div></div></div><div class="section-title"><h2>Pembahasan setiap soal</h2></div><div class="list">${(h.details||[]).map((d,i)=>`<div class="card"><span class="tag">Soal ${i+1} · Bab ${d.chapter} · ${d.id||""}</span><p><b>${esc(d.question)}</b></p><p class="${d.ok?"answer-good":"answer-bad"}">Jawaban kamu: ${d.answer===undefined?"Belum dijawab":`${"ABCD"[d.answer]}. ${esc(d.options[d.answer])}`} </p><p class="answer-good">Jawaban benar: ${"ABCD"[d.correct]}. ${esc(d.options[d.correct])}</p><p>${esc(d.explanation||"Pembahasan belum tersedia.")}</p><button class="btn ghost" data-learn-id="${d.chapter}|${encodeURIComponent(d.sectionId||"")}">Pelajari materi terkait</button></div>`).join("")}</div><div class="lesson-actions" style="margin-top:15px"><button class="btn" data-go="builder">Kuis baru</button><button class="btn secondary" id="retryWrong">Ulangi soal salah</button><button class="btn ghost" data-go="progress">Lihat evaluasi</button></div>`}
function formatDuration(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/60)} menit ${sec%60} detik`}
function finishQuiz(auto=false){if(!quiz||quiz.finished)return;quiz.finished=true;if(timerHandle){clearInterval(timerHandle);timerHandle=null}let correct=0,wrong=0,blank=0,details=[];quiz.items.forEach((q,i)=>{let a=quiz.answers[i];if(a===undefined)blank++;else if(a===q[5])correct++;else wrong++;details.push({chapter:q[0],question:q[3],options:q[4].slice(),correct:q[5],answer:a,ok:a===q[5],explanation:q[6],id:q.id,sectionId:q.sectionId})});let total=quiz.items.length,score=total?Math.round(correct/total*100):0,durationSeconds=Math.max(0,Math.floor((Date.now()-quiz.started)/1000)),h={title:quiz.title,total,correct,wrong,blank,score,date:new Date().toISOString(),durationSeconds,mode:quiz.mode,details,flagged:quiz.flagged.map(i=>quiz.items[i]?.id).filter(Boolean)};state.history.unshift(h);state.xp+=correct*5+10;const wrongIds=details.filter(d=>!d.ok).map(d=>d.id);state.wrong=[...new Set([...(state.wrong||[]),...wrongIds])];state.questionSeen=[...new Set([...(state.questionSeen||[]),...quiz.items.map(q=>q.id)])];state.attempts.total=(state.attempts.total||0)+total;state.attempts.correct=(state.attempts.correct||0)+correct;save();quiz=null;page="result";render()}

function flashcards(){let cards=glossary;if(!cards.length)return "";let g=cards[flashIndex%cards.length];return `${head("ACTIVE RECALL","Flashcards","Uji ingatan istilah penting. Ketuk kartu untuk melihat arti.")}<div class="card" style="max-width:650px;margin:auto;text-align:center"><div class="muted">Kartu ${flashIndex+1} dari ${cards.length}</div><div class="flash" id="flashCard" style="margin:18px 0"><div><span class="tag">${flashBack?"ARTI":"ISTILAH"}</span><strong style="display:block;margin-top:15px">${flashBack?g[1]:g[0]}</strong><p class="muted">${flashBack?"Ketuk untuk kembali ke istilah":"Ketuk untuk melihat arti"}</p></div></div><div style="display:flex;justify-content:center;gap:8px"><button class="btn ghost" id="flashPrev">←</button><button class="btn secondary" id="flashFlip">Balik kartu</button><button class="btn" id="flashNext">Berikutnya →</button></div></div>`}
function progressPage(){let total=chapters.reduce((a,c)=>a+c.sections.length,0),done=Object.keys(state.completed).filter(k=>state.completed[k]).length,avg=state.history.length?Math.round(state.history.reduce((a,h)=>a+(Number(h.score)||0),0)/state.history.length):0;return `${head("LEARNING ANALYTICS","Progress & evaluasi","Lihat bagian yang sudah dipelajari dan area yang perlu diperkuat.")}<div class="grid stats"><div class="card"><small>Materi selesai</small><div class="num">${done}/${total}</div></div><div class="card"><small>Rata-rata nilai</small><div class="num">${avg}%</div></div><div class="card"><small>Soal salah tersimpan</small><div class="num">${state.wrong.length}</div></div><div class="card"><small>Waktu belajar</small><div class="num">${state.studyMinutes}m</div></div></div><div class="card"><h2 style="margin-top:0">Kemajuan per bab</h2><div class="list">${chapters.map(c=>{let p=cardProgress(c),qs=questions.filter(q=>q[0]===c.id);return `<div><div style="display:flex;justify-content:space-between"><b>Bab ${c.id} · ${c.short}</b><span class="muted">${p.pct}% · ${p.done}/${p.total} subbab</span></div><div class="progress" style="margin:8px 0 15px"><span style="width:${p.pct}%"></span></div></div>`}).join("")}</div></div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Prioritas review</h3>${state.wrong.length?state.wrong.map(ref=>{const q=typeof ref==="string"?questions.find(x=>x.id===ref):questions[ref];return q?`<div class="review"><b>${esc(q[3])}</b><p class="muted">${esc(q.sectionId)} · Jawaban salah sebelumnya.</p><button class="btn ghost" data-learn-id="${q[0]}|${encodeURIComponent(q.sectionId)}">Pelajari materi terkait</button></div>`:""}).join(""):`<p class="muted">Belum ada soal salah yang tercatat.</p>`}</div><div class="card"><h3>Aturan evaluasi</h3><p><span class="pill">≥80%</span> Cukup dikuasai</p><p><span class="tag">60–79%</span> Latihan tambahan</p><p><span style="color:var(--red);font-weight:700">Di bawah 60%</span> Baca ulang subbab</p><p class="muted">Analisis memanfaatkan pemetaan soal ke bab dan subbab. Materi tanpa soal terhubung tetap dapat dipelajari melalui daftar isi.</p></div></div>`}
function historyPage(){return `${head("ACTIVITY","Riwayat kuis","Hasil sesi kuis yang tersimpan pada perangkat ini.")}<div class="list">${state.history.map(h=>`<div class="card rowitem"><div class="grow"><b>${h.title}</b><small>${new Date(h.date||h.ended||Date.now()).toLocaleString("id-ID")} · ${h.correct}/${h.total} benar</small></div><div class="result-score" style="font-size:25px">${Number(h.score)||0}%</div></div>`).join("")||`<div class="card empty">Belum ada riwayat kuis.</div>`}</div>`}
function bookmarksPage(){let items=state.bookmarks;return `${head("SAVED ITEMS","Bookmark","Materi dan soal yang kamu simpan.")}<div class="list">${items.map(k=>{if(k.startsWith("q")){let i=+k.slice(1),q=questions[i];return q?`<div class="card"><span class="tag">Soal · Bab ${q[0]}</span><p><b>${q[3]}</b></p><button class="btn ghost" data-unbook="${k}">Hapus bookmark</button></div>`:""}let [ch,sec]=k.split("-").map(Number),s=chapters[ch-1]?.sections[sec];return s?`<div class="card"><span class="tag">Materi · Bab ${ch}</span><p><b>${s[0]}</b></p><button class="btn ghost" data-unbook="${k}">Hapus bookmark</button></div>`:""}).join("")||`<div class="card empty">Belum ada bookmark. Simpan materi atau soal untuk menemukannya kembali.</div>`}</div>`}
function notesPage(){return `${head("PERSONAL NOTES","Catatan pribadi","Simpan catatan belajar secara lokal di perangkat ini.")}<div class="card"><div class="field"><label>Judul catatan</label><input id="noteTitle" placeholder="Contoh: Perbedaan krisis dan reaksi"></div><div class="field"><label>Isi catatan</label><textarea id="noteBody" placeholder="Tulis pemahaman atau hal yang perlu diingat..."></textarea></div><button class="btn" id="saveNote">Simpan catatan</button></div><div class="section-title"><h2>Catatan tersimpan</h2></div><div class="list">${state.notes.map((n,i)=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.body).replace(/\n/g,"<br>")}</p><small class="muted">${new Date(n.date).toLocaleString("id-ID")}</small><div style="margin-top:8px"><button class="btn ghost" data-del-note="${i}">Hapus</button></div></div>`).join("")||`<div class="card empty">Belum ada catatan.</div>`}</div>`}
function glossaryPage(){return `${head("REFERENCE","Glosarium","Cari istilah penting dari ketiga bab.")}<input class="search" id="glossSearch" placeholder="Cari istilah atau pengertian..."><div class="list" id="glossList" style="margin-top:15px">${glossList(glossary)}</div>`}
function glossList(arr){return arr.map(g=>`<div class="rowitem"><div class="grow"><b>${g[0]}</b><small>${g[1]}</small></div></div>`).join("")}
function settingsPage(){return `${head("PREFERENCES","Pengaturan","Atur target dan kelola data pembelajaran di perangkat ini.")}<div class="card"><h3>Target belajar harian</h3><div class="field"><label>Target waktu (menit)</label><input id="goalInput" type="number" min="5" max="240" value="${state.goal}"></div><button class="btn" id="saveGoal">Simpan target</button><div class="field" style="margin-top:20px"><label>Catat waktu belajar (menit)</label><input id="minuteInput" type="number" min="1" max="240" value="15"></div><button class="btn secondary" id="addMinutes">Tambahkan waktu belajar</button></div><div class="card" style="margin-top:15px"><h3>Data & privasi</h3><p class="muted">Data progres, bookmark, catatan, dan riwayat disimpan di localStorage browser/perangkat ini. Data tidak otomatis tersinkron ke perangkat lain.</p><button class="btn ghost" id="exportData">Ekspor data JSON</button> <button class="btn danger" id="resetData">Hapus seluruh data lokal</button></div><div class="card" style="margin-top:15px"><h3>Audit kualitas konten</h3><p>Bank soal aktif: <b>${questions.length}</b> · ID unik: <b>${questionAudit().uniqueIds}</b> · Duplikasi teks persis: <b>${questionAudit().exactDuplicates.length}</b> · Kandidat mirip: <b>${questionAudit().potentialDuplicates.length}</b></p><p class="muted">Jumlah per bab: ${questionAudit().byChapter.map(x=>`Bab ${x.chapter}: ${x.count}`).join(" · ")}. Setiap soal aktif menggunakan empat opsi A–D. Status konten: 45 soal lama perlu audit ulang dan soal hasil ekspansi ditandai untuk penelaahan akademis; kemiripan semantik tidak dapat dipastikan hanya oleh pencocokan kata.</p></div><p class="footer-note">Penghapusan data tidak dapat dibatalkan. Ekspor cadangan sebelum menghapus.</p>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function bindPage(){
$$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$$("[data-ch]").forEach(b=>b.onclick=()=>{activeChapter=+b.dataset.ch;activeSection=0;render()});
$$("[data-sec]").forEach(b=>b.onclick=()=>{activeSection=+b.dataset.sec;render();const panel=$("#lessonPanel");if(panel)panel.scrollIntoView({behavior:"smooth",block:"start"})});
let mark=$("#markDone");if(mark)mark.onclick=()=>{state.completed[activeChapter+"-"+activeSection]=true;save();toast("Subbab ditandai selesai.");render()};
let check=$("#completeCheck");if(check)check.onchange=()=>{state.completed[activeChapter+"-"+activeSection]=check.checked;save()};
let bookmarkSection=$("#bookmarkSection");if(bookmarkSection)bookmarkSection.onclick=()=>{const key=activeChapter+"-"+activeSection;state.bookmarks=state.bookmarks.includes(key)?state.bookmarks.filter(x=>x!==key):[...state.bookmarks,key];save();render()};
let bs=$("#bankSearch");if(bs){let filter=()=>{let a=questions.filter(q=>(!+$("#bankChapter").value||q[0]===+$("#bankChapter").value)&&(!$("#bankCat").value||q[1]===$("#bankCat").value)&&(!$("#bankDiff").value||q[2]===$("#bankDiff").value)&&(q[3]+" "+q[6]+" "+q.sectionId).toLowerCase().includes(bs.value.toLowerCase()));$("#bankList").innerHTML=bankList(a);$("#bankCount").textContent=`${a.length} soal ditemukan`;bindPage()};[bs,$("#bankChapter"),$("#bankCat"),$("#bankDiff")].forEach(x=>{if(x)x.oninput=filter})}
let jump=$("#jumpSection");if(jump)jump.onchange=()=>{activeSection=+jump.value;render();const panel=$("#lessonPanel");if(panel)panel.scrollIntoView({behavior:"smooth",block:"start"})};
let ms=$("#materialSearch");if(ms)ms.oninput=()=>{$("#materialList").innerHTML=materialList(chapters[activeChapter-1],ms.value);bindPage()};
$$('[data-learn-id]').forEach(b=>b.onclick=()=>{const [ch,encoded]=b.dataset.learnId.split("|");const title=decodeURIComponent(encoded||"");activeChapter=+ch;const idx=chapters[activeChapter-1].sections.findIndex(x=>x[0]===title);activeSection=Math.max(0,idx);go("materi")});
$$("[data-bookq]").forEach(b=>b.onclick=()=>{let k="q"+b.dataset.bookq;state.bookmarks=state.bookmarks.includes(k)?state.bookmarks.filter(x=>x!==k):[...state.bookmarks,k];save();render()});
$$("[data-unbook]").forEach(b=>b.onclick=()=>{state.bookmarks=state.bookmarks.filter(x=>x!==b.dataset.unbook);save();render()});
if($("#startQuiz")){["buildChapter","buildCat","buildDiff","buildSource"].forEach(id=>{const el=$("#"+id);if(el)el.onchange=updateQuizCount});updateQuizCount();$("#startQuiz").onclick=()=>{let arr=quizCandidates(),n=+$("#buildCount").value;if(!arr.length){toast("Tidak ada soal sesuai filter.");return}if(n>arr.length)n=arr.length;if($("#buildShuffle").checked)arr=arr.slice().sort(()=>Math.random()-.5);arr=arr.slice(0,n);const ch=+$("#buildChapter").value;quiz={items:arr,answers:Array(arr.length).fill(undefined),flagged:[],started:Date.now(),timeLimit:Math.max(0,Math.min(180,+$("#buildTime").value||0)),title:`Kuis ${ch?"Bab "+ch:"Gabungan"} · ${n} soal`,mode:$("#buildMode").value,finished:false};quizIndex=0;page="quiz";render();if(quiz&&quiz.timeLimit)startTimer()}}
if(page==="quiz"){if($("#prevQ"))$("#prevQ").onclick=()=>{quizIndex--;render()};if($("#nextQ"))$("#nextQ").onclick=()=>{quizIndex++;render()};if($("#flagQ"))$("#flagQ").onclick=()=>{quiz.flagged=quiz.flagged.includes(quizIndex)?quiz.flagged.filter(x=>x!==quizIndex):[...quiz.flagged,quizIndex];render()};$$("[data-qnav]").forEach(b=>b.onclick=()=>{quizIndex=+b.dataset.qnav;render()});$$('input[name="answer"]').forEach(x=>x.onchange=()=>{quiz.answers[quizIndex]=+x.value;render()});["submitQuiz","submitQuiz2"].forEach(id=>{if($("#"+id))$("#"+id).onclick=()=>{let blank=quiz.answers.filter(x=>x===undefined).length;if(blank&&!confirm(`Masih ada ${blank} soal kosong. Tetap kumpulkan?`))return;finishQuiz()}})}
if($("#retryWrong"))$("#retryWrong").onclick=()=>{let ids=state.history[0]?.details.filter(d=>!d.ok).map(d=>d.id)||[];let arr=ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean);if(!arr.length){toast("Tidak ada soal salah pada sesi ini.");return}quiz={items:arr,answers:Array(arr.length).fill(undefined),flagged:[],started:Date.now(),timeLimit:0,title:"Review soal yang salah",mode:"practice"};quizIndex=0;page="quiz";render()};
if($("#flashCard"))$("#flashCard").onclick=()=>{flashBack=!flashBack;render()};if($("#flashFlip"))$("#flashFlip").onclick=()=>{flashBack=!flashBack;render()};if($("#flashNext"))$("#flashNext").onclick=()=>{flashIndex=(flashIndex+1)%glossary.length;flashBack=false;render()};if($("#flashPrev"))$("#flashPrev").onclick=()=>{flashIndex=(flashIndex-1+glossary.length)%glossary.length;flashBack=false;render()};
if($("#saveNote"))$("#saveNote").onclick=()=>{let title=$("#noteTitle").value.trim(),body=$("#noteBody").value.trim();if(!title||!body){toast("Isi judul dan catatan terlebih dahulu.");return}state.notes.unshift({title,body,date:new Date().toISOString()});save();render();toast("Catatan disimpan.")};
$$("[data-del-note]").forEach(b=>b.onclick=()=>{state.notes.splice(+b.dataset.delNote,1);save();render()});
if($("#glossSearch"))$("#glossSearch").oninput=()=>{$("#glossList").innerHTML=glossList(glossary.filter(g=>(g[0]+" "+g[1]).toLowerCase().includes($("#glossSearch").value.toLowerCase())))};
if($("#saveGoal"))$("#saveGoal").onclick=()=>{state.goal=Math.max(5,Math.min(240,+$("#goalInput").value||15));save();toast("Target diperbarui.");render()};
if($("#addMinutes"))$("#addMinutes").onclick=()=>{let n=Math.max(1,Math.min(240,+$("#minuteInput").value||0));state.studyMinutes+=n;save();toast(`${n} menit ditambahkan.`);render()};
if($("#exportData"))$("#exportData").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="learning-master-backup.json";a.click();URL.revokeObjectURL(a.href)};
if($("#resetData"))$("#resetData").onclick=()=>{if(confirm("Yakin menghapus seluruh progres, catatan, bookmark, dan riwayat lokal? Tindakan ini tidak dapat dibatalkan.")){localStorage.removeItem("ulm_state");location.reload()}};
}
let timerHandle=null;function startTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=setInterval(()=>{if(!quiz){clearInterval(timerHandle);timerHandle=null;return}if(quiz.timeLimit&&Math.floor((Date.now()-quiz.started)/1000)>=quiz.timeLimit*60){clearInterval(timerHandle);timerHandle=null;finishQuiz(true)}else if(page==="quiz"){let el=document.querySelector(".quiz-side .muted");if(el)el.innerHTML=`Terjawab: ${quiz.answers.filter(x=>x!==undefined).length}/${quiz.items.length}<br>Belum dijawab: ${quiz.answers.filter(x=>x===undefined).length}<br>Ditandai: ${quiz.flagged.length}`}},1000)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&quiz&&quiz.timeLimit){/* elapsed time uses wall clock; timer continues logically */}});
document.documentElement.dataset.theme=state.theme==="dark"?"dark":"";$("#themeBtn").textContent=state.theme==="dark"?"☀":"☾";updateTop();render();if(toastSafeLoadError)toast("Data lama tidak dapat dibaca. Tidak ada data yang dihapus.");else if(migrationBackupWarning)toast("Backup otomatis tidak dapat dibuat. Data lama belum ditimpa; ekspor data sebelum menyimpan perubahan.");
</script>
</body>
</html>
